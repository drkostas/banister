name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Typecheck + Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci || npm install
      - name: Build (tsc)
        run: npm run build
      - name: Unit tests
        run: npm test
